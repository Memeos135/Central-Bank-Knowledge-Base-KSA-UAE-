[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --tb=short
# Makes `sama` importable regardless of the invocation directory — this file
# (and the sama/ package next to it) moved into codebase/ in the 2026-09
# reorg, so relying on pytest's rootdir-insertion heuristic is no longer
# reliable when pytest is invoked from the repo root instead of from here.
pythonpath = .
